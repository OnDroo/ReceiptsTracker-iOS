name: ReceiptsTracker
options:
  bundleIdPrefix: link.ondrov
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""

targets:
  ReceiptsTracker:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ReceiptsTracker
        excludes:
          - "**/.gitkeep"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: link.ondrov.receipts
        INFOPLIST_FILE: ReceiptsTracker/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO

  ReceiptsTrackerTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ReceiptsTrackerTests
        excludes:
          - "**/.gitkeep"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: link.ondrov.receipts.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: ReceiptsTracker

schemes:
  ReceiptsTracker:
    build:
      targets:
        ReceiptsTracker: all
        ReceiptsTrackerTests: [test]
    test:
      targets:
        - ReceiptsTrackerTests