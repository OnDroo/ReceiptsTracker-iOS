name: iOS Release (Unsigned IPA)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version string (defaults to MARKETING_VERSION in project.yml, e.g. 1.0.0)"
        type: string
        default: ""
      create_release:
        description: "Publish / update a GitHub Release with the IPA attached"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build-ipa:
    name: Build Unsigned iOS IPA
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine release version
        id: meta
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            VERSION="${TAG#v}"
            SHOULD_RELEASE="true"
          else
            if [ -n "$INPUT_VERSION" ]; then
              VERSION="${INPUT_VERSION#v}"
            else
              VERSION=$(awk -F'"' '/MARKETING_VERSION:/ {print $2; exit}' project.yml)
              VERSION="${VERSION:-1.0.0}"
            fi
            TAG="v${VERSION}"
            SHOULD_RELEASE="${{ inputs.create_release }}"
          fi

          BUILD_NUMBER="${GITHUB_RUN_NUMBER}"
          IPA_NAME="Receipts-${VERSION}.ipa"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "ipa_name=$IPA_NAME" >> "$GITHUB_OUTPUT"
          echo "should_release=$SHOULD_RELEASE" >> "$GITHUB_OUTPUT"

          echo "Building Receipts $VERSION (build $BUILD_NUMBER) -> $IPA_NAME (release=$SHOULD_RELEASE)"

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen &> /dev/null; then
            brew install xcodegen
          fi

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Archive Release build for iOS (arm64, unsigned)
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          BUILD_NUMBER: ${{ steps.meta.outputs.build_number }}
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project ReceiptsTracker.xcodeproj \
            -scheme ReceiptsTracker \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/ReceiptsTracker.xcarchive" \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package unsigned .ipa
        env:
          IPA_NAME: ${{ steps.meta.outputs.ipa_name }}
        run: |
          set -euo pipefail
          APP_PATH="$RUNNER_TEMP/ReceiptsTracker.xcarchive/Products/Applications/ReceiptsTracker.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "ERROR: Expected .app bundle not found at $APP_PATH"
            exit 1
          fi

          STAGE_DIR="$RUNNER_TEMP/ipa-stage"
          OUT_DIR="$RUNNER_TEMP/release-output"
          rm -rf "$STAGE_DIR" "$OUT_DIR"
          mkdir -p "$STAGE_DIR/Payload" "$OUT_DIR"

          cp -R "$APP_PATH" "$STAGE_DIR/Payload/ReceiptsTracker.app"
          rm -rf "$STAGE_DIR/Payload/ReceiptsTracker.app/_CodeSignature" \
                 "$STAGE_DIR/Payload/ReceiptsTracker.app/embedded.mobileprovision"

          echo "=== Verifying iOS arm64 binary ==="
          file "$STAGE_DIR/Payload/ReceiptsTracker.app/ReceiptsTracker"

          (cd "$STAGE_DIR" && zip -qry "$OUT_DIR/$IPA_NAME" Payload)
          ls -lh "$OUT_DIR/$IPA_NAME"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Receipts-${{ steps.meta.outputs.version }}-unsigned-ipa
          path: ${{ runner.temp }}/release-output/${{ steps.meta.outputs.ipa_name }}
          retention-days: 30

      - name: Publish GitHub Release
        if: steps.meta.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
          BUILD_NUMBER: ${{ steps.meta.outputs.build_number }}
          IPA_PATH: ${{ runner.temp }}/release-output/${{ steps.meta.outputs.ipa_name }}
        run: |
          set -euo pipefail
          NOTES=$(cat <<EOF
          Unsigned iOS release build of **Receipts ${VERSION}** (build ${BUILD_NUMBER}) for arm64 iPhone & iPad (iOS 17+).

          ### Installing on iPhone (Free Apple ID)
          This \`.ipa\` is unsigned so you can sign and install it with your own Apple ID using:
          - **[SideStore](https://sidestore.io/)** (recommended — refreshes directly on iPhone over Wi-Fi)
          - **[AltStore](https://altstore.io/)** or **[Sideloadly](https://sideloadly.io/)** (Windows / macOS)

          After installing, enable **Developer Mode** (*Settings → Privacy & Security → Developer Mode*) and trust your Apple ID profile (*Settings → General → VPN & Device Management*).
          EOF
          )

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$IPA_PATH" --clobber
            gh release edit "$TAG" --notes "$NOTES"
          else
            gh release create "$TAG" "$IPA_PATH" \
              --target "$GITHUB_SHA" \
              --title "Receipts ${TAG}" \
              --notes "$NOTES"
          fi
