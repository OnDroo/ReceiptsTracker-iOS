name: iOS Simulator Screenshots

on:
  workflow_dispatch:
    inputs:
      appearance:
        description: "Color appearance to capture"
        type: choice
        default: both
        options:
          - both
          - light
          - dark
      include_wide_layout:
        description: "Also capture wide (regular size class / iPad mini) layout"
        type: boolean
        default: true

jobs:
  capture:
    name: Capture (${{ matrix.device }})
    runs-on: macos-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        device: ${{ fromJSON(inputs.include_wide_layout && '["iphone", "wide"]' || '["iphone"]') }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen &> /dev/null; then
            brew install xcodegen
          fi

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Select Simulator (${{ matrix.device }})
        id: sim
        env:
          DEVICE_KIND: ${{ matrix.device }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, subprocess, sys

          kind = os.environ["DEVICE_KIND"]
          data = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "--json"]))
          ios_runtimes = sorted(
              (k for k in data["devices"].keys() if "iOS" in k),
              reverse=True
          )

          chosen = None
          for runtime in ios_runtimes:
              devices = [d for d in data["devices"][runtime] if d.get("isAvailable")]
              if kind == "iphone":
                  matches = [d for d in devices if "iPhone" in d.get("name", "")]
              else:
                  # Prefer iPad mini (closest to unfolded iPhone Duo 7.6" regular canvas), fallback to any iPad
                  matches = [d for d in devices if "iPad mini" in d.get("name", "")] or [d for d in devices if "iPad" in d.get("name", "")]
              if matches:
                  chosen = matches[0]
                  break

          if not chosen:
              print(f"No available simulator found for {kind}", file=sys.stderr)
              sys.exit(1)

          print(f"udid={chosen['udid']}")
          print(f"name={chosen['name']}")
          PY

      - name: Build and Capture Screenshots (${{ steps.sim.outputs.name }})
        env:
          APPEARANCE: ${{ inputs.appearance }}
          DEVICE_KIND: ${{ matrix.device }}
          SIM_UDID: ${{ steps.sim.outputs.udid }}
        run: |
          set -euo pipefail
          OUT_ROOT="$RUNNER_TEMP/screenshots"
          mkdir -p "$OUT_ROOT"

          if [ "$APPEARANCE" = "both" ]; then
            MODES="light dark"
          else
            MODES="$APPEARANCE"
          fi

          xcodebuild build-for-testing \
            -project ReceiptsTracker.xcodeproj \
            -scheme ReceiptsTrackerScreenshots \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO

          # Boot simulator once per device and reuse it across light/dark modes
          echo "=== Booting ${DEVICE_KIND} simulator (${SIM_UDID}) ==="
          xcrun simctl boot "$SIM_UDID" || true
          xcrun simctl bootstatus "$SIM_UDID" -b
          sleep 5
          xcrun simctl status_bar "$SIM_UDID" override --time "9:41" --batteryState charged --batteryLevel 100 || true

          for mode in $MODES; do
            out_dir="$OUT_ROOT/${DEVICE_KIND}-${mode}"
            result_bundle="$RUNNER_TEMP/results-${DEVICE_KIND}-${mode}.xcresult"
            rm -rf "$out_dir" "$result_bundle"
            mkdir -p "$out_dir"

            echo "=== Capturing ${DEVICE_KIND} (${mode}) ==="
            xcrun simctl ui "$SIM_UDID" appearance "$mode"

            xcodebuild test-without-building \
              -project ReceiptsTracker.xcodeproj \
              -scheme ReceiptsTrackerScreenshots \
              -derivedDataPath "$RUNNER_TEMP/DerivedData" \
              -destination "platform=iOS Simulator,id=$SIM_UDID" \
              -resultBundlePath "$result_bundle" \
              -retry-tests-on-failure \
              -test-iterations 2 \
              -only-testing:ReceiptsTrackerUITests/ScreenshotUITests/testCaptureAppScreenshots \
              TEST_RUNNER_SCREENSHOT_DIR="$out_dir" \
              CODE_SIGNING_ALLOWED=NO

            # Fallback: if simulator sandbox prevented direct writes, extract PNGs from .xcresult
            if [ -z "$(find "$out_dir" -maxdepth 1 -name '*.png')" ]; then
              echo "Direct PNG output empty; extracting attachments from $result_bundle"
              export_dir="$RUNNER_TEMP/export-${DEVICE_KIND}-${mode}"
              rm -rf "$export_dir"
              mkdir -p "$export_dir"
              xcrun xcresulttool export attachments --path "$result_bundle" --output-path "$export_dir"
              python3 - "$export_dir" "$out_dir" <<'PY'
          import json, os, shutil, sys

          export_dir, out_dir = sys.argv[1], sys.argv[2]
          manifest_path = os.path.join(export_dir, "manifest.json")
          if os.path.exists(manifest_path):
              with open(manifest_path, "r", encoding="utf-8") as f:
                  manifest = json.load(f)
              for entry in manifest:
                  for att in entry.get("attachments", []):
                      src = os.path.join(export_dir, att.get("exportedFileName", ""))
                      suggested = att.get("suggestedHumanReadableName", "")
                      if os.path.isfile(src) and suggested:
                          base = suggested.split("_0_")[0]
                          if not base.lower().endswith(".png"):
                              base += ".png"
                          shutil.copy2(src, os.path.join(out_dir, base))
          PY
            fi

            echo "Captured files in ${DEVICE_KIND}-${mode}:"
            ls -la "$out_dir"
          done

          xcrun simctl shutdown "$SIM_UDID" || true

      - name: Upload Device Screenshots
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ matrix.device }}
          path: ${{ runner.temp }}/screenshots
          if-no-files-found: error
          retention-days: 1

  package:
    name: Package Screenshots
    runs-on: ubuntu-latest
    needs: capture
    steps:
      - name: Download Device Screenshots
        uses: actions/download-artifact@v4
        with:
          pattern: screenshots-*
          path: screenshots
          merge-multiple: true

      - name: Write Summary
        run: |
          echo "## Captured iOS Simulator Screenshots" >> "$GITHUB_STEP_SUMMARY"
          find screenshots -name "*.png" | sort | while read -r file; do
            rel="${file#screenshots/}"
            echo "- \`$rel\`" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Upload Combined Screenshots Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-screenshots
          path: screenshots
          if-no-files-found: error
          retention-days: 30
